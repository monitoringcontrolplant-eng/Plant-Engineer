<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Populasi Unit (Google Sheets)</title>
    <!-- Tailwind CSS untuk Desain Modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS untuk Fitur Excel Upload & Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Custom Notification Box (Pengganti alert()) -->
    <div id="notificationModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 border border-slate-100 text-center transform transition-all">
            <div id="notifIconWrapper" class="w-12 h-12 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center text-xl mx-auto mb-3">
                <i id="notifIcon" class="fa-solid fa-info"></i>
            </div>
            <h4 id="notifTitle" class="text-base font-bold text-slate-800 mb-1">Informasi Sistem</h4>
            <p id="notifMessage" class="text-sm text-slate-600 mb-6">Pesan sistem...</p>
            <button onclick="closeNotification()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-xl text-sm transition shadow-sm">Mengerti</button>
        </div>
    </div>

    <!-- Header / Navbar -->
    <header class="bg-blue-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-white text-blue-600 p-2.5 rounded-xl shadow">
                    <i class="fa-solid fa-truck-monster text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">Sistem Populasi Unit</h1>
                    <p class="text-xs text-blue-100">Sinkronisasi Otomatis Google Spreadsheet</p>
                </div>
            </div>
            
            <!-- Indikator Status & Tombol Aksi Cepat -->
            <div class="flex items-center gap-3 flex-wrap justify-center">
                <span id="sync-status" class="bg-blue-500 text-white text-xs px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Terhubung ke Cloud
                </span>
                <button onclick="fetchDataFromCloud()" class="bg-blue-700 hover:bg-blue-800 text-white text-xs px-3 py-2 rounded-lg transition flex items-center gap-1.5 font-medium shadow-sm">
                    <i class="fa-solid fa-rotate"></i> Muat Ulang
                </button>
            </div>
        </div>
    </header>

    <!-- Konten Utama -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">

        <!-- Kartu Statistik -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Unit</p>
                    <h3 id="stat-total" class="text-2xl font-bold text-slate-700 mt-1">0</h3>
                </div>
                <div class="bg-blue-50 text-blue-600 p-3 rounded-xl"><i class="fa-solid fa-cubes text-lg"></i></div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Ready / Beroperasi</p>
                    <h3 id="stat-ready" class="text-2xl font-bold text-emerald-600 mt-1">0</h3>
                </div>
                <div class="bg-emerald-50 text-emerald-600 p-3 rounded-xl"><i class="fa-solid fa-circle-check text-lg"></i></div>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Maintenance</p>
                    <h3 id="stat-maint" class="text-2xl font-bold text-amber-600 mt-1">0</h3>
                </div>
                <div class="bg-amber-50 text-amber-600 p-3 rounded-xl"><i class="fa-solid fa-screwdriver-wrench text-lg"></i></div>
            </div>
        </div>

        <!-- Panel Kontrol (Form, Upload, Download, Search) -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6">
            <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 mb-6 pb-6 border-b border-slate-100">
                <!-- Form Tambah Unit Manual -->
                <form id="unit-form" onsubmit="handleFormSubmit(event)" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3 w-full lg:w-auto flex-1">
                    <input type="text" id="kode" placeholder="Kode Unit (Cth: DT-01)" required class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="text" id="nama" placeholder="Nama / Tipe Unit" required class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="text" id="kategori" placeholder="Kategori (Cth: Dump Truck)" required class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="text" id="lokasi" placeholder="Lokasi Site" required class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <select id="status" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                        <option value="Ready">Ready</option>
                        <option value="Maintenance">Maintenance</option>
                        <option value="Standby">Standby</option>
                    </select>
                    <button type="submit" id="btn-submit" class="sm:col-span-2 md:col-span-5 bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg text-sm transition flex items-center justify-center gap-2 shadow-sm">
                        <i class="fa-solid fa-plus"></i> Tambah Unit ke Spreadsheet
                    </button>
                </form>
            </div>

            <!-- Bagian Fitur File Excel & Pencarian -->
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                    <!-- Upload Excel -->
                    <label class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-4 py-2 rounded-lg cursor-pointer transition flex items-center gap-2 shadow-sm">
                        <i class="fa-solid fa-file-excel"></i> Upload Excel
                        <input type="file" id="upload-excel" accept=".xlsx, .xls, .csv" class="hidden" onchange="handleExcelUpload(event)">
                    </label>
                    <!-- Download Excel -->
                    <button onclick="downloadExcel()" class="bg-slate-700 hover:bg-slate-800 text-white text-sm font-medium px-4 py-2 rounded-lg transition flex items-center gap-2 shadow-sm">
                        <i class="fa-solid fa-download"></i> Download Excel
                    </button>
                </div>

                <!-- Kolom Pencarian -->
                <div class="w-full sm:w-72 relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input type="text" id="search-box" onkeyup="filterTable()" placeholder="Cari unit..." class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
        </div>

        <!-- Tabel Data Unit -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 uppercase text-xs tracking-wider border-b border-slate-200">
                            <th class="px-6 py-3 font-semibold">Kode Unit</th>
                            <th class="px-6 py-3 font-semibold">Nama / Tipe Unit</th>
                            <th class="px-6 py-3 font-semibold">Kategori</th>
                            <th class="px-6 py-3 font-semibold">Lokasi Operasional</th>
                            <th class="px-6 py-3 font-semibold">Status</th>
                        </tr>
                    </thead>
                    <tbody id="unit-table-body" class="divide-y divide-slate-100 text-sm">
                        <tr>
                            <td colspan="5" class="px-6 py-8 text-center text-slate-400">
                                <i class="fa-solid fa-spinner fa-spin mr-2"></i> Memuat data dari Google Spreadsheet...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Script Logika Sistem -->
    <script>
        // URL Google Apps Script yang sudah disematkan
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyb3k0NuskdwprEL7M4lNAwYLSU3jpqnhvbCxcAe_WsaSsMOcW_N6wtAAvo64nEUS2Prg/exec";

        let unitData = [];

        // Fungsi kustom pengganti alert()
        function showNotification(title, message, isError = false) {
            document.getElementById('notifTitle').innerText = title;
            document.getElementById('notifMessage').innerText = message;
            const iconWrap = document.getElementById('notifIconWrapper');
            const icon = document.getElementById('notifIcon');
            
            if (isError) {
                iconWrap.className = "w-12 h-12 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center text-xl mx-auto mb-3";
                icon.className = "fa-solid fa-triangle-exclamation";
            } else {
                iconWrap.className = "w-12 h-12 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center text-xl mx-auto mb-3";
                icon.className = "fa-solid fa-circle-check";
            }
            document.getElementById('notificationModal').classList.remove('hidden');
        }

        function closeNotification() {
            document.getElementById('notificationModal').classList.add('hidden');
        }

        window.onload = function() {
            fetchDataFromCloud();
        };

        function fetchDataFromCloud() {
            const tbody = document.getElementById('unit-table-body');
            tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Sedang menyinkronkan data...</td></tr>`;

            fetch(APPS_SCRIPT_URL)
                .then(response => response.json())
                .then(data => {
                    unitData = data;
                    renderTable(unitData);
                    updateStats();
                })
                .catch(error => {
                    console.error('Gagal mengambil data:', error);
                    tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-rose-500">Gagal terhubung ke Google Spreadsheet. Periksa koneksi internet atau izin deployment Apps Script Anda.</td></tr>`;
                });
        }

        function renderTable(data) {
            const tbody = document.getElementById('unit-table-body');
            tbody.innerHTML = "";

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-8 text-center text-slate-400">Belum ada data populasi unit di spreadsheet.</td></tr>`;
                return;
            }

            data.forEach(item => {
                let badgeColor = "bg-slate-100 text-slate-700";
                if (item.status === "Ready") badgeColor = "bg-emerald-100 text-emerald-700";
                else if (item.status === "Maintenance") badgeColor = "bg-amber-100 text-amber-700";
                else if (item.status === "Standby") badgeColor = "bg-blue-100 text-blue-700";

                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                tr.innerHTML = `
                    <td class="px-6 py-4 font-medium text-slate-800">${item.kode || ''}</td>
                    <td class="px-6 py-4 text-slate-600">${item.nama || ''}</td>
                    <td class="px-6 py-4 text-slate-600">${item.kategori || ''}</td>
                    <td class="px-6 py-4 text-slate-600">${item.lokasi || ''}</td>
                    <td class="px-6 py-4">
                        <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${badgeColor}">${item.status || 'Ready'}</span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateStats() {
            document.getElementById('stat-total').innerText = unitData.length;
            document.getElementById('stat-ready').innerText = unitData.filter(i => i.status === "Ready").length;
            document.getElementById('stat-maint').innerText = unitData.filter(i => i.status === "Maintenance").length;
        }

        function handleFormSubmit(event) {
            event.preventDefault();
            
            const newData = {
                action: "add",
                kode: document.getElementById('kode').value,
                nama: document.getElementById('nama').value,
                kategori: document.getElementById('kategori').value,
                lokasi: document.getElementById('lokasi').value,
                status: document.getElementById('status').value
            };

            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan ke Spreadsheet...`;

            fetch(APPS_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(newData)
            })
            .then(res => res.json())
            .then(response => {
                document.getElementById('unit-form').reset();
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-plus"></i> Tambah Unit ke Spreadsheet`;
                fetchDataFromCloud();
                showNotification("Berhasil", "Data unit berhasil ditambahkan ke Spreadsheet!");
            })
            .catch(error => {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-plus"></i> Tambah Unit ke Spreadsheet`;
                showNotification("Gagal", "Gagal menyimpan data ke cloud.", true);
            });
        }

        function handleExcelUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const jsonRows = XLSX.utils.sheet_to_json(worksheet);

                const formattedItems = jsonRows.map(row => ({
                    kode: row['Kode Unit'] || row['kode'] || row['KODE'] || '',
                    nama: row['Nama Unit'] || row['nama'] || row['NAMA'] || '',
                    kategori: row['Kategori'] || row['kategori'] || row['KATEGORI'] || '',
                    lokasi: row['Lokasi'] || row['lokasi'] || row['LOKASI'] || '',
                    status: row['Status'] || row['status'] || row['STATUS'] || 'Ready'
                }));

                if (formattedItems.length === 0) {
                    showNotification("Perhatian", "File Excel kosong atau format kolom tidak sesuai.", true);
                    return;
                }

                fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "bulk",
                        items: formattedItems
                    })
                })
                .then(res => res.json())
                .then(response => {
                    showNotification("Berhasil", `Berhasil mengunggah ${formattedItems.length} data unit ke Spreadsheet!`);
                    fetchDataFromCloud();
                })
                .catch(err => {
                    showNotification("Gagal", "Gagal melakukan upload data massal.", true);
                });
            };
            reader.readAsArrayBuffer(file);
        }

        function downloadExcel() {
            if (unitData.length === 0) {
                showNotification("Perhatian", "Tidak ada data untuk diunduh.", true);
                return;
            }
            const worksheet = XLSX.utils.json_to_sheet(unitData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Populasi Unit");
            XLSX.writeFile(workbook, "Data_Populasi_Unit.xlsx");
        }

        function filterTable() {
            const keyword = document.getElementById('search-box').value.toLowerCase();
            const filtered = unitData.filter(item => 
                (item.kode && item.kode.toLowerCase().includes(keyword)) ||
                (item.nama && item.nama.toLowerCase().includes(keyword)) ||
                (item.kategori && item.kategori.toLowerCase().includes(keyword)) ||
                (item.lokasi && item.lokasi.toLowerCase().includes(keyword)) ||
                (item.status && item.status.toLowerCase().includes(keyword))
            );
            renderTable(filtered);
        }
    </script>
</body>
</html>
